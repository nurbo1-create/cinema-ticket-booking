<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="modern-style.css">
    <title>Броньдау - Great Cinema</title>
</head>
<body>
    <!-- Навигация и футер добавятся автоматически -->
    
    <div class="container">
        <!-- Уникальный контент страницы -->
    </div>

    <!-- Подключаем общие компоненты -->
    <script src="navigation.js"></script>
    <script src="footer.js"></script>
    <!-- Остальные специфичные скрипты -->
    
    
    <div class="booking-container">
        <!-- остальной контент -->
    </div>

    <script src="navigation.js"></script>
    <!-- остальные скрипты -->

    <div class="booking-container">
        <!-- Левая панель -->
        <div class="movie-sidebar">
            <img src="" alt="" class="movie-poster-large" id="poster">
            
            <div class="movie-details">
                <h1 id="movieTitle">Фильм атауы</h1>
                
                <div class="movie-meta">
                    <p><i class="bi bi-clock"></i> <span id="movieDuration">Ұзақтығы</span></p>
                    <p><i class="bi bi-tag"></i> <span id="movieGenre">Жанр</span></p>
                    <p><i class="bi bi-person"></i> <span id="movieRating">Рейтинг</span></p>
                </div>

                <div class="movie-info">
                    <h3>Режиссер</h3>
                    <p id="movieDirector">Режиссер аты</p>
                    
                    <h3>Актерлер</h3>
                    <p id="movieActors">Актерлер тізімі</p>
                </div>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="booking-main">
            <!-- Выбор даты -->
            <div class="date-selection">
                <h2 class="section-title">Күнды таңдаңыз</h2>
                <div class="dates-grid" id="datesContainer">
                    <!-- Даты будут заполнены JavaScript -->
                </div>
            </div>

            <!-- Выбор времени -->
            <div class="time-selection">
                <h2 class="section-title">Сеанс уақыты</h2>
                <div class="times-grid" id="timesContainer">
                    <!-- Время будет заполнено JavaScript -->
                </div>
            </div>

            <!-- Схема мест -->
            <div class="seats-section">
                <div class="screen"></div>
                
                <div class="seats-container">
                    <div class="seats-grid" id="seatsGrid">
                        <!-- Места будут сгенерированы JavaScript -->
                    </div>
                </div>

                <!-- Легенда -->
                <div class="seats-legend">
                    <div class="legend-item">
                        <div class="legend-color legend-available"></div>
                        <span>Бос</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color legend-selected"></div>
                        <span>Таңдалған</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color legend-occupied"></div>
                        <span>Брондалған</span>
                    </div>
                </div>
            </div>

            <!-- Информация о выборе -->
            <div class="selection-info">
                <div id="selectedInfo" style="text-align: center; margin: 1rem 0; color: var(--text-secondary);">
                    Орын таңдаңыз
                </div>
            </div>

            <!-- Кнопка бронирования -->
            <div class="booking-actions">
                <button class="btn-booking" id="bookButton" disabled>
                    <i class="bi bi-ticket-perforated"></i>
                    Брондау - <span id="totalPrice">0 ₸</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // База данных всех фильмов
        const moviesDatabase = {
            "Ant man": {
                title: "Ant man",
                poster: "img/ant man.jpg",
                duration: "2 сағат 5 минут",
                genre: "Фантастика • Супергеройский • Комедия",
                rating: "PG-13",
                director: "Пейтон Рид",
                actors: "Пол Радд, Эванджелин Лилли, Майкл Дуглас",
                basePrice: 2000
            },
            "Avengers": {
                title: "Avengers",
                poster: "img/avengers.jpg",
                duration: "2 сағат 23 минут",
                genre: "Фантастика • Супергеройский • Экшен",
                rating: "PG-13",
                director: "Джосс Уидон",
                actors: "Роберт Дауни-мл., Крис Эванс, Скарлетт Йоханссон",
                basePrice: 2200
            },
            "Dexter Resurrection": {
                title: "Dexter Resurrection",
                poster: "img/dexter.jpg",
                duration: "1 сағат 50 минут",
                genre: "Триллер • Драма • Криминал",
                rating: "R",
                director: "Маркос Зига",
                actors: "Майкл С. Холл, Дженнифер Карпентер",
                basePrice: 1800
            },
            "Jhon Wick": {
                title: "Jhon Wick",
                poster: "img/Jhon Wick.jpg",
                duration: "1 сағат 41 минут",
                genre: "Экшен • Триллер • Криминал",
                rating: "R",
                director: "Чад Стахелски",
                actors: "Киану Ривз, Микаэл Нюквист, Альфи Аллен",
                basePrice: 2100
            },
            "Spiderman": {
                title: "Spiderman",
                poster: "img/spiderman.jpg",
                duration: "2 сағат 21 минут",
                genre: "Фантастика • Супергеройский • Приключения",
                rating: "PG-13",
                director: "Джон Уоттс",
                actors: "Том Холланд, Зендея, Джейкоб Баталон",
                basePrice: 2300
            },
            "Topgun": {
                title: "Topgun",
                poster: "img/topgun.jpg",
                duration: "2 сағат 11 минут",
                genre: "Экшен • Драма • Приключения",
                rating: "PG-13",
                director: "Джозеф Косински",
                actors: "Том Круз, Майлз Теллер, Дженнифер Коннелли",
                basePrice: 2400
            }
        };

        // Получение параметра фильма из URL
        function getMovieFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const movieParam = urlParams.keys().next().value;
            return movieParam || "Ant man"; // По умолчанию Ant man
        }

        // Данные о текущем фильме
        let currentMovieData = null;

        // Генерация схемы мест
        function generateSeatsLayout() {
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
            const layout = {};
            
            rows.forEach(row => {
                layout[row] = [];
                for (let i = 1; i <= 10; i++) {
                    // Случайным образом занимаем некоторые места
                    const isOccupied = Math.random() < 0.2;
                    layout[row].push({
                        number: i,
                        occupied: isOccupied,
                        price: row === 'A' || row === 'B' ? currentMovieData.basePrice + 500 : currentMovieData.basePrice
                    });
                }
            });
            
            return layout;
        }

        // Инициализация страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Получаем выбранный фильм
            const selectedMovie = getMovieFromURL();
            currentMovieData = moviesDatabase[selectedMovie];
            
            if (!currentMovieData) {
                // Если фильм не найден, используем первый
                currentMovieData = moviesDatabase["Ant man"];
            }
            
            // Заполняем информацию о фильме
            updateMovieInfo();
            initializeDates();
            initializeTimes();
            initializeSeats();
            setupNavigation();
        });

        function updateMovieInfo() {
            document.getElementById('poster').src = currentMovieData.poster;
            document.getElementById('poster').alt = currentMovieData.title;
            document.getElementById('movieTitle').textContent = currentMovieData.title;
            document.getElementById('movieDuration').textContent = currentMovieData.duration;
            document.getElementById('movieGenre').textContent = currentMovieData.genre;
            document.getElementById('movieRating').textContent = currentMovieData.rating;
            document.getElementById('movieDirector').textContent = currentMovieData.director;
            document.getElementById('movieActors').textContent = currentMovieData.actors;
            
            // Обновляем title страницы
            document.title = `Броньдау - ${currentMovieData.title} - Great Cinema`;
        }

        function initializeDates() {
            const container = document.getElementById('datesContainer');
            const dates = [
                { date: "2024-01-20", label: "Бүгін", active: true },
                { date: "2024-01-21", label: "Ертең" },
                { date: "2024-01-22", label: "Сенбі" },
                { date: "2024-01-23", label: "Жексенбі" }
            ];
            
            container.innerHTML = dates.map(date => `
                <button class="date-btn ${date.active ? 'active' : ''}" 
                        data-date="${date.date}">
                    ${date.label}
                </button>
            `).join('');

            // Обработчики для дат
            document.querySelectorAll('.date-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }

        function initializeTimes() {
            const container = document.getElementById('timesContainer');
            const times = [
                { time: "10:00", type: "2D", price: currentMovieData.basePrice },
                { time: "13:30", type: "2D", price: currentMovieData.basePrice },
                { time: "17:00", type: "3D", price: currentMovieData.basePrice + 500 },
                { time: "20:30", type: "4DX", price: currentMovieData.basePrice + 1000 }
            ];
            
            container.innerHTML = times.map((time, index) => `
                <button class="time-btn ${index === 2 ? 'active' : ''}" 
                        data-time="${time.time}" 
                        data-price="${time.price}">
                    ${time.time}<br>
                    <small>${time.type}</small>
                </button>
            `).join('');

            // Обработчики для времени
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    updatePrice();
                });
            });
        }

        function initializeSeats() {
            const container = document.getElementById('seatsGrid');
            const seatsLayout = generateSeatsLayout();
            let html = '';

            for (const [row, seats] of Object.entries(seatsLayout)) {
                html += `<div class="seat-row">`;
                html += `<div class="row-label">${row}</div>`;
                
                seats.forEach(seat => {
                    const seatClass = seat.occupied ? 'occupied' : 'available';
                    html += `
                        <div class="seat ${seatClass}" 
                             data-row="${row}" 
                             data-number="${seat.number}"
                             data-price="${seat.price}">
                            ${seat.number}
                        </div>
                    `;
                });
                
                html += `<div class="row-label">${row}</div>`;
                html += `</div>`;
            }

            container.innerHTML = html;

            // Обработчики для мест
            document.querySelectorAll('.seat.available').forEach(seat => {
                seat.addEventListener('click', function() {
                    this.classList.toggle('selected');
                    updateSelectionInfo();
                    updatePrice();
                });
            });
        }

        function updateSelectionInfo() {
            const selectedSeats = document.querySelectorAll('.seat.selected');
            const info = document.getElementById('selectedInfo');
            
            if (selectedSeats.length === 0) {
                info.textContent = 'Орын таңдаңыз';
                document.getElementById('bookButton').disabled = true;
            } else {
                const seatsList = Array.from(selectedSeats).map(seat => 
                    `${seat.dataset.row}${seat.dataset.number}`
                ).join(', ');
                
                info.textContent = `Таңдалған орындар: ${seatsList}`;
                document.getElementById('bookButton').disabled = false;
            }
        }

        function updatePrice() {
            const selectedSeats = document.querySelectorAll('.seat.selected');
            const timeBtn = document.querySelector('.time-btn.active');
            
            let total = 0;
            
            if (timeBtn) {
                const timePrice = parseInt(timeBtn.dataset.price);
                total = selectedSeats.length * timePrice;
            } else {
                selectedSeats.forEach(seat => {
                    total += parseInt(seat.dataset.price);
                });
            }
            
            document.getElementById('totalPrice').textContent = `${total} ₸`;
        }

        function setupNavigation() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const navAuth = document.getElementById('navAuth');
            
            if (currentUser) {
                navAuth.innerHTML = `
                    <span class="user-welcome">Қош келдіңіз, ${currentUser.name}!</span>
                    <a href="profile.html" class="nav-link">Профиль</a>
                    <a href="about.html" class="nav-link">Біз туралы</a>
                    <button class="btn-logout" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Шығу
                    </button>
                `;
            } else {
                navAuth.innerHTML = `
                    <a href="auth.html" class="nav-link">Тіркелу/Кіру</a>
                    <a href="profile.html" class="nav-link">Профиль</a>
                    <a href="about.html" class="nav-link">Біз туралы</a>
                    <a href="index.html" class="nav-link">Басты бет</a>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Обработчик кнопки бронирования
        document.getElementById('bookButton').addEventListener('click', function() {
            const selectedSeats = document.querySelectorAll('.seat.selected');
            if (selectedSeats.length === 0) return;

            // Собираем данные для оплаты
            const orderData = {
                movie: currentMovieData.title,
                seats: Array.from(selectedSeats).map(seat => 
                    `${seat.dataset.row}${seat.dataset.number}`
                ).join(', '),
                total: parseInt(document.getElementById('totalPrice').textContent),
                cinema: "Great Cinema",
                time: document.querySelector('.time-btn.active')?.dataset.time || "19:00",
                type: "4DX"
            };

            // Сохраняем данные заказа и переходим к оплате
            localStorage.setItem('currentOrder', JSON.stringify(orderData));
            window.location.href = 'payment.html';
        });
    </script>
</body>
</html>
